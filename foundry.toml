[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.23"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# StreamingLeaderboard is large; IR codegen keeps it under the EIP-170 24,576-byte limit.
via_ir = true
# contracts/v0.1/* is pre-existing broken legacy (imports a Markee.sol/Interfaces.sol
# that never existed in that dir); exclude so the project compiles.
skip = ["contracts/v0.1/*", "contracts/revenue/**", "test/revenue/**", "script/revenue/**"]

[rpc_endpoints]
base = "${BASE_RPC_URL}"

# Isolate the new revenue suite from historical streaming fork tests and pin
# a compiler supporting the OpenZeppelin 5.6 proxy dependencies.
[profile.revenue]
src = "contracts/revenue"
test = "test/revenue"
script = "script/revenue"
out = "out/revenue"
cache_path = "cache/revenue"
solc = "0.8.30"
extra_output = ["storageLayout"]
skip = []

[profile.revenue.fuzz]
runs = 256

[profile.revenue.invariant]
runs = 128
depth = 64
fail_on_revert = true
