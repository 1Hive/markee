name: Assign Vercel staging domain

on:
  push:
    branches-ignore:
      - main
      - dev
    paths:
      - frontend/**
  delete:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-staging-domain-slots
  cancel-in-progress: false

jobs:
  assign:
    if: >-
      github.event_name == 'push' &&
      !github.event.deleted &&
      github.ref_name != 'main' &&
      github.ref_name != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assign the lowest available staging domain
        id: assign
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          BRANCH_NAME: ${{ github.ref_name }}
          SLOT_ACTION: assign
        run: node .github/scripts/manage-vercel-staging-domain.mjs

      - name: Comment staging URL on open PRs
        if: steps.assign.outputs.assigned_domain != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN: ${{ steps.assign.outputs.assigned_domain }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "🚀 Staging: https://${DOMAIN}"
          fi

  release:
    if: >-
      github.event_name == 'delete' &&
      github.event.ref_type == 'branch' &&
      github.event.ref != 'main' &&
      github.event.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Release the deleted branch's staging domain
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          BRANCH_NAME: ${{ github.event.ref }}
          SLOT_ACTION: release
        run: node .github/scripts/manage-vercel-staging-domain.mjs
