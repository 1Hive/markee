name: Mergeback main → dev

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin main dev

      - name: Try merging main into dev
        id: merge
        run: |
          git checkout -B dev origin/dev

          if git merge origin/main --no-ff --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            if git diff --name-only --diff-filter=U | grep -q .; then
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
            else
              echo "Merge failed for a reason other than conflicts."
              exit 1
            fi
          fi

      - name: Push merged dev branch
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push origin dev

      - name: Create conflict branch
        if: steps.merge.outputs.conflict == 'true'
        id: conflict_branch
        env:
          BRANCH_NAME: sync/main-to-dev-${{ github.run_id }}
        run: |
          git checkout -B "$BRANCH_NAME" origin/main
          git push origin "$BRANCH_NAME"

          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.conflict_branch.outputs.branch }}
        run: |
          gh pr create \
            --head "$BRANCH_NAME" \
            --base dev \
            --title "⚠️ Merge main → dev (conflicts detected)" \
            --body-file - <<'EOF'
          Automatic synchronization of `main` into `dev` failed because merge conflicts were detected.

          Please resolve the conflicts manually and merge this pull request.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
