name: CI

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID || secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
      NEXT_PUBLIC_BASE_RPC_URL: ${{ vars.NEXT_PUBLIC_BASE_RPC_URL || 'https://mainnet.base.org' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
      NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY || 'ci-placeholder' }}
      NEXT_PUBLIC_GRAPH_TOKEN: ${{ vars.NEXT_PUBLIC_GRAPH_TOKEN || 'ci-placeholder' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check build environment
        id: build-env
        run: |
          if [ -n "${NEXT_PUBLIC_PRIVY_APP_ID:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Next.js build because NEXT_PUBLIC_PRIVY_APP_ID is not configured as a repository variable or secret."
          fi

      - name: Build
        if: steps.build-env.outputs.enabled == 'true'
        run: npm run build
