name: Alchemy account budget

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alchemy-account-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account-budget:
    name: Deployed account usage forecast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Fetch usage and forecast monthly budget
        run: node --import tsx tests/integration/alchemy-account-budget.ts
        env:
          ALCHEMY_ADMIN_ACCESS_KEY: ${{ secrets.ALCHEMY_ADMIN_ACCESS_KEY }}
      - name: Upload account forecast
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-account-forecast
          path: frontend/test-results/alchemy-usage/forecast.json
          if-no-files-found: warn
          retention-days: 14
